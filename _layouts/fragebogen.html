<!DOCTYPE html>
<html lang="de">
{% include head.html css="fragebogen" %}

<body>

{% include header.html %}


<!-- SEITENTITEL -->

<section class="page-header">
    <div class="site-container">
        <h1>{{ page.title }}</h1>
    </div>
</section>


<!-- INHALT -->

<main class="page-content fragebogen-content">
    <div class="site-container">

        <!-- Einleitung aus pages/fragebogen.md -->
        {{ content }}

        <!-- FRAGEBOGEN-GENERATOR
             Inhalt: assets/fragebogen/fragebogen.md, Einstellungen: pages/fragebogen.md.
             Die Logik steht in assets/js/fragebogen/ -->
        <section class="fragebogen-tool"
                 id="fragebogen-tool"
                 aria-label="Individuellen Fragebogen erstellen"
                 data-inhalt="{{ page.inhalt | relative_url }}"
                 data-platzhalter="{{ page.platzhalter }}"
                 data-kopfzeile="{{ page.kopfzeile }}"
                 data-logo="{{ '/assets/images/logo.svg' | relative_url }}"
                 data-worker="{{ '/assets/js/vendor/pdf.worker.min.js' | relative_url }}">

            <!-- Eingabezeile (oben) -->
            <form class="fragebogen-form" novalidate>

                <label for="fragebogen-name">Name der Technologie</label>
                <input type="text"
                       id="fragebogen-name"
                       name="technologie"
                       maxlength="60"
                       autocomplete="off"
                       placeholder="z. B. Pflegedoku-App">

                <button type="submit" class="hero-button fragebogen-button" id="fragebogen-download" disabled>
                    Fragebogen herunterladen (PDF)
                </button>

                <p class="fragebogen-status" id="fragebogen-status" role="status" aria-live="polite"></p>

            </form>

            <!-- Vorschau (darunter) -->
            <div class="fragebogen-vorschau-bereich">
                <h2 class="fragebogen-vorschau-titel">Vorschau</h2>
                <div class="fragebogen-vorschau" id="fragebogen-vorschau">
                    <p class="fragebogen-laden">Vorschau wird geladen …</p>
                </div>

                <!-- Blättern durch die Seiten des Fragebogens -->
                <nav class="fragebogen-blaettern" id="fragebogen-blaettern" aria-label="Seiten der Vorschau" hidden>
                    <button type="button" id="fragebogen-zurueck">
                        <span aria-hidden="true">←</span> Zurück
                    </button>
                    <span id="fragebogen-seitenzahl" aria-live="polite">Seite 1 von 1</span>
                    <button type="button" id="fragebogen-weiter">
                        Weiter <span aria-hidden="true">→</span>
                    </button>
                </nav>
            </div>

        </section>

    </div>
</main>


{% include footer.html %}

<!-- Aussehen des PDFs aus _data/fragebogen_stil.yml (von Jekyll als JSON eingesetzt) -->
<script type="application/json" id="fragebogen-stil">{{ site.data.fragebogen_stil | jsonify }}</script>

<!-- PDF-Bibliotheken (liegen im Projekt, kein externer Server) -->
<script src="{{ '/assets/js/vendor/pdf.min.js' | relative_url }}"></script>
<script src="{{ '/assets/js/vendor/pdfmake.min.js' | relative_url }}"></script>
<script src="{{ '/assets/js/vendor/vfs_fonts.min.js' | relative_url }}"></script>
<script src="{{ '/assets/js/vendor/hypher-de.js' | relative_url }}"></script>
<!-- Fragebogen-Logik als Module: seite.js lädt markdown.js, umbruch.js und pdf.js selbst -->
<script type="module" src="{{ '/assets/js/fragebogen/seite.js' | relative_url }}"></script>

</body>
</html>

title: Meine Webseite
description: Meine erste Jerkyll Webseite
url: "https://huangj98.github.io"
baseurl: "/Webseite"
# Beiträge für "Aktuelles": ein Ordner pro Beitrag in _aktuelles/ (beitrag.md + Bild)
# Datum, Adresse und Bild setzt _plugins/aktuelles.rb automatisch
collections:
  aktuelles:
    output: true

defaults:
  - scope:
      path: ""
      type: aktuelles
    values:
      layout: beitrag
